{{- /*
kubemox reads Secrets by name only, so it needs `get` and nothing else - no
list, no watch - and only in the namespaces those Secrets live in.
*/ -}}
{{- $namespaces := .Values.rbac.secretNamespaces | default (list .Release.Namespace) }}
{{- range $ns := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubemox-secret-reader
  namespace: {{ $ns }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubemox-secret-reader
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubemox-secret-reader
subjects:
- kind: ServiceAccount
  name: {{ include "kubemox.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
